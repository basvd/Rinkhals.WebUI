[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "rinkhals-webui"
version = "2.0.0"
description = "Web interface for Rinkhals and Kobra-specific features."
license = { text = "MIT" }
authors = [{ name = "Bas van Doren" }]
requires-python = ">=3.11"
keywords = ["micropython", "webui", "rinkhals"]

[project.optional-dependencies]
dev = [
    "micropython-stdlib-stubs>=1.20.0.post2",
    "ruff>=0.4.10",
    "pyright>=1.1.347",
    "pytest>=8.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rinkhals_webui"]

[tool.hatch.envs.default]
dependencies = [
    "micropython-stdlib-stubs>=1.20.0.post2",
    "ruff>=0.4.10",
    "pytest>=8.3",
    "pyright>=1.1.347",
]

[tool.hatch.envs.default.env-vars]
MICROPYPATH = "src"

[tool.hatch.envs.default.scripts]
lint = "ruff check src"
format = "ruff format src"
test = "pytest"
run = "micropython -m rinkhals_webui"
repl = "micropython"
